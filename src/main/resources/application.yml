server:
  port: ${PORT:8080}

spring:
  application:
    name: oreo-insight-factory
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:oreo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-change-this-secret}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  github-models:
    token: ${GITHUB_TOKEN:}
    url: ${GITHUB_MODELS_URL:https://models.github.ai/inference/chat/completions}
    model-id: ${MODEL_ID:openai/gpt-4.1-mini}
  mail:
    from: ${MAIL_FROM:no-reply@oreo.test}
    to: ${MAIL_TO:analyst@oreo.test}
